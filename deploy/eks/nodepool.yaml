# Karpenter nodes for sandboxes: Graviton, gVisor's runsc installed at boot, labelled and tainted as
# the chart's RuntimeClass expects. The cluster's CNI is Cilium, so cilium-egress.yaml applies.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: agentd-sandboxes
spec:
  template:
    metadata:
      labels:
        cma.anthropic.com/sandbox-node: "true"
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: agentd-sandboxes
      taints:
        - key: cma.anthropic.com/sandbox-node
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "2000"
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: agentd-sandboxes
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: agentd-sandbox-nodes
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: agentd
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: agentd
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    set -euo pipefail
    # gVisor release 20261116 for arm64, checked against the sha512 read from its release on 2026-11-22.
    # Bump the release and the digest together.
    release=20261116
    sha512=a64ce2d5ba6825a0a6459ee6a9ce40164749c2d276a945b885673988c4e545e66b2f4ef3a08e068a26cca676061c8c5e8ba982156feb786f0eab995f5b8b854d
    cd /tmp
    curl -fsSLo gvisor.tar.bz2 "https://storage.googleapis.com/gvisor/releases/release/$release/aarch64/gvisor.tar.bz2"
    echo "$sha512  gvisor.tar.bz2" | sha512sum -c -
    tar -xjf gvisor.tar.bz2 runsc containerd-shim-runsc-v1
    install -m 0755 runsc containerd-shim-runsc-v1 /usr/local/bin/

    --BOUNDARY
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      containerd:
        config: |
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
            runtime_type = "io.containerd.runsc.v1"

    --BOUNDARY--
